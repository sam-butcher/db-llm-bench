# Gold-equivalence check for the pokedex pilot: the three real DB packages
# each run their own gold query (fed by a dummy model), and the result is
# compared to `expected`. Because all three DBs compare against the SAME
# expected value, 36/36 accurate proves the gold queries are mutually
# equivalent as well as correct. This validates the dataset WITHOUT any LLM.
#
# Prereq: pilot stack up and seeded (cd databases/pokedex && docker compose up -d --build).
# Run:    cargo run -p bench-cli -- src/pokedex-golden.yml results-pokedex-golden.json
#         (expect: "36/36 accurate")
#
# Responses are consumed in DB order (typedb, sql, neo4j), 12 per DB, in
# question order. Generated from data/pokedex/questions.json.
dbs:
  - typedb:
      prompts: data/pokedex/typedb
      url: http://localhost:1729
      database: bench
      auth:
        username: admin
        password: password
        tls: false
      schema: data/pokedex/typedb/schema.tql
  - sql:
      prompts: data/pokedex/sql
      url: postgres://bench_ro:bench_ro@localhost/bench
      schema: data/pokedex/sql/schema.sql
  - neo4j:
      prompts: data/pokedex/neo4j
      url: bolt://localhost:7687
      auth:
        username: neo4j
        password: password
      schema: data/pokedex/neo4j/schema.txt
models:
  - dummy:
      responses:
        - |
          ```
          match $fire isa poketype, has name "Fire"; typing (bearer: $p, category: $fire); reduce $count = count($p);
          ```
        - |
          ```
          match $p isa pokemon, has name "Charizard"; $tp isa typing, links (bearer: $p, category: $t), has slot 1; $t has name $n; select $n;
          ```
        - |
          ```
          match $water isa poketype, has name "Water"; move-type (typed: $m, category: $water); $m has power $pw; reduce $avg = mean($pw);
          ```
        - |
          ```
          with fun water_flyer_exists() -> boolean:
            match
              $p isa pokemon;
              $w isa poketype, has name "Water";
              $f isa poketype, has name "Flying";
              typing (bearer: $p, category: $w);
              typing (bearer: $p, category: $f);
            return check;
          match
          let $exists = water_flyer_exists();
          ```
        - |
          ```
          match $grass isa poketype, has name "Grass"; typing (bearer: $p, category: $grass); $p has name $n; select $n;
          ```
        - |
          ```
          match $elec isa poketype, has name "Electric"; move-type (typed: $m, category: $elec); $m has name $name, has power $power; fetch { "move": $name, "power": $power };
          ```
        - |
          ```
          match $m isa move, has name $name, has power $power; sort $power desc; limit 3; select $name;
          ```
        - |
          ```
          match $elec isa poketype, has name "Electric"; move-type (typed: $m, category: $elec); learning (learner: $p, learned: $m); $p has name $n; select $n; distinct;
          ```
        - |
          ```
          match $tb isa move, has name "Thunderbolt"; $lvlup isa move-method, has name "Level up"; $l isa learning, links (learner: $p, learned: $tb, via: $lvlup), has level $level; $p has name $pokemon; fetch { "pokemon": $pokemon, "level": $level };
          ```
        - |
          ```
          match $water isa poketype, has name "Water"; $e isa efficacy, links (attacker: $water, defender: $def), has factor $f; $f > 100; $def has name $n; select $n;
          ```
        - |
          ```
          match $static isa ability, has name "Static"; ability-slot (owner: $p, granted: $static); $p has name $n; select $n;
          ```
        - |
          ```
          match $fire isa poketype, has name "Fire"; typing (bearer: $p, category: $fire); not { $water isa poketype, has name "Water"; move-type (typed: $m, category: $water); learning (learner: $p, learned: $m); }; $p has name $n; select $n;
          ```
        - |
          ```
          SELECT COUNT(*) FROM pokemon p JOIN pokemon_poketype pt ON pt.pokemon_id = p.id JOIN poketype t ON pt.poketype_id = t.id WHERE t.name = 'Fire';
          ```
        - |
          ```
          SELECT t.name FROM pokemon p JOIN pokemon_poketype pt ON pt.pokemon_id = p.id JOIN poketype t ON pt.poketype_id = t.id WHERE p.name = 'Charizard' AND pt.slot = 1;
          ```
        - |
          ```
          SELECT AVG(m.power) FROM move m JOIN poketype t ON m.poketype_id = t.id WHERE t.name = 'Water';
          ```
        - |
          ```
          SELECT EXISTS (SELECT 1 FROM pokemon p JOIN pokemon_poketype pt1 ON pt1.pokemon_id = p.id JOIN poketype t1 ON pt1.poketype_id = t1.id JOIN pokemon_poketype pt2 ON pt2.pokemon_id = p.id JOIN poketype t2 ON pt2.poketype_id = t2.id WHERE t1.name = 'Water' AND t2.name = 'Flying');
          ```
        - |
          ```
          SELECT p.name FROM pokemon p JOIN pokemon_poketype pt ON pt.pokemon_id = p.id JOIN poketype t ON pt.poketype_id = t.id WHERE t.name = 'Grass';
          ```
        - |
          ```
          SELECT m.name AS move, m.power FROM move m JOIN poketype t ON m.poketype_id = t.id WHERE t.name = 'Electric';
          ```
        - |
          ```
          SELECT name FROM move ORDER BY power DESC LIMIT 3;
          ```
        - |
          ```
          SELECT DISTINCT p.name FROM pokemon p JOIN pokemon_move pm ON pm.pokemon_id = p.id JOIN move m ON pm.move_id = m.id JOIN poketype t ON m.poketype_id = t.id WHERE t.name = 'Electric';
          ```
        - |
          ```
          SELECT p.name AS pokemon, pm.level FROM pokemon_move pm JOIN pokemon p ON pm.pokemon_id = p.id JOIN move m ON pm.move_id = m.id JOIN move_method mm ON pm.method_id = mm.id WHERE m.name = 'Thunderbolt' AND mm.name = 'Level up';
          ```
        - |
          ```
          SELECT def.name FROM efficacy e JOIN poketype atk ON e.damage_poketype_id = atk.id JOIN poketype def ON e.target_poketype_id = def.id WHERE atk.name = 'Water' AND e.factor > 100;
          ```
        - |
          ```
          SELECT p.name FROM pokemon p JOIN pokemon_ability pa ON pa.pokemon_id = p.id JOIN ability a ON pa.ability_id = a.id WHERE a.name = 'Static';
          ```
        - |
          ```
          SELECT p.name FROM pokemon p JOIN pokemon_poketype pt ON pt.pokemon_id = p.id JOIN poketype t ON pt.poketype_id = t.id WHERE t.name = 'Fire' AND NOT EXISTS (SELECT 1 FROM pokemon_move pm JOIN move m ON pm.move_id = m.id JOIN poketype wt ON m.poketype_id = wt.id WHERE pm.pokemon_id = p.id AND wt.name = 'Water');
          ```
        - |
          ```
          MATCH (p:Pokemon)-[:HAS_TYPE]->(:PokeType {name: 'Fire'}) RETURN count(p)
          ```
        - |
          ```
          MATCH (:Pokemon {name: 'Charizard'})-[:HAS_TYPE {slot: 1}]->(t:PokeType) RETURN t.name
          ```
        - |
          ```
          MATCH (m:Move)-[:OF_TYPE]->(:PokeType {name: 'Water'}) RETURN avg(m.power)
          ```
        - |
          ```
          RETURN EXISTS { MATCH (p:Pokemon)-[:HAS_TYPE]->(:PokeType {name: 'Water'}), (p)-[:HAS_TYPE]->(:PokeType {name: 'Flying'}) }
          ```
        - |
          ```
          MATCH (p:Pokemon)-[:HAS_TYPE]->(:PokeType {name: 'Grass'}) RETURN p.name
          ```
        - |
          ```
          MATCH (m:Move)-[:OF_TYPE]->(:PokeType {name: 'Electric'}) RETURN m.name AS move, m.power AS power
          ```
        - |
          ```
          MATCH (m:Move) RETURN m.name ORDER BY m.power DESC LIMIT 3
          ```
        - |
          ```
          MATCH (p:Pokemon)-[:LEARNS]->(:Learning)-[:OF_MOVE]->(m:Move)-[:OF_TYPE]->(:PokeType {name: 'Electric'}) RETURN DISTINCT p.name
          ```
        - |
          ```
          MATCH (p:Pokemon)-[:LEARNS]->(l:Learning)-[:OF_MOVE]->(:Move {name: 'Thunderbolt'}), (l)-[:VIA]->(:MoveMethod {name: 'Level up'}) RETURN p.name AS pokemon, l.level AS level
          ```
        - |
          ```
          MATCH (:PokeType {name: 'Water'})-[e:EFFECTIVE_AGAINST]->(def:PokeType) WHERE e.factor > 100 RETURN def.name
          ```
        - |
          ```
          MATCH (p:Pokemon)-[:HAS_ABILITY]->(:Ability {name: 'Static'}) RETURN p.name
          ```
        - |
          ```
          MATCH (p:Pokemon)-[:HAS_TYPE]->(:PokeType {name: 'Fire'}) WHERE NOT EXISTS { MATCH (p)-[:LEARNS]->(:Learning)-[:OF_MOVE]->(:Move)-[:OF_TYPE]->(:PokeType {name: 'Water'}) } RETURN p.name
          ```
questionsPath: data/pokedex/questions.json
exampleCounts:
  - 3
maxRetryCounts:
  - 0

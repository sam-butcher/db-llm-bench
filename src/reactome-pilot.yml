# Reactome model-selection pilot.
#
# Purpose: decide which models are worth a full run. Six candidates over eight
# questions; keep the three that land at genuinely different points on the
# SQL -> Cypher -> TypeQL gradient, and drop anything that scores zero
# everywhere (no signal) or matches another candidate (no spread).
#
# This is NOT a results config. It shares the DB block with reactome.yml but
# runs a subset of questions and a single attempt per question, so its numbers
# are for ranking candidates against each other, not for reporting.
#
# Prereqs:
#   1. Seed the Reactome stack:  cd databases/reactome && docker compose up -d --wait
#   2. Regenerate the subset:    python3 analysis/make_pilot.py
#   3. Export one API key per hosted model — see the models block below.
#   4. For the one local model:  OLLAMA_CONTEXT_LENGTH=65536 ollama serve
#      then  ollama pull muse-glimmer:30b-mlx
#
# Run:  cargo run -p bench-cli -- src/reactome-pilot.yml results-pilot.json
#
# Cost: 8 questions x 3 DBs x 3 repetitions = 72 calls per model. Prompt size
# is set by the DB's schema, so it varies a lot — ~27k tokens for Neo4j, ~18k
# for MySQL, ~5k for TypeDB — totalling ~1.2M input tokens per model.
#
# Of that, only ~56k is unique: the template and schema are identical across a
# DB's 24 calls, so ~1.15M is a repeated prefix. Where the provider caches
# prefixes automatically that input costs 2-20% of list, which is why the whole
# pilot lands under a dollar per provider rather than the tens of dollars a
# naive 1.2M x list-price estimate suggests. Output dominates instead, and only
# for the models that emit reasoning traces — hence the per-model max_tokens
# above being the real cost lever.
dbs:
  - typedb:
      prompts: data/prompts/typedb.txt
      url: http://localhost:1729
      database: reactome
      auth:
        username: admin
        password: password
        tls: false
      schema: data/reactome/typedb/schema.tql
  - neo4j:
      prompts: data/prompts/neo4j.txt
      url: bolt://localhost:7687
      auth:
        username: neo4j
        password: password
      schema: data/reactome/neo4j/schema.txt
  - sql:
      # The shared data/prompts/sql.txt names PostgreSQL; this dataset runs on
      # MySQL, so it uses the MySQL-worded variant of the same template.
      prompts: data/prompts/sql-mysql.txt
      url: mysql://bench_ro:bench_ro@localhost/reactome
      schema: data/reactome/sql/schema.sql

# Every label carries the serving provider, not just the model name: the same
# open weights served by two providers can differ in quantization and in the
# context actually served, so "GLM-5.2" alone does not identify a run.
#
# max_tokens is set per model rather than left at the 4096 default. Several of
# these emit long reasoning traces before the answer — GLM-5.2 is reported at
# ~43k output tokens per task, and Kimi K2.7-Code enforces thinking mode — and
# a model that spends its budget thinking and never emits a fenced query scores
# as a capability failure when it is really a configuration one.
models:
  # Small active footprint (80B total / 3B active) and coding-agent tuned.
  # Expected lower anchor, and the successor to the qwen3-coder:30b already run
  # locally, so it is the closest thing to a continuous data point.
  #
  # QwenCloud is Alibaba's first-party portal for these models, but it is where
  # the API key is issued rather than an endpoint of its own: its own model page
  # documents this DashScope URL and DASHSCOPE_API_KEY, so this is the canonical
  # route despite the domain not saying "qwen".
  #
  # Note that Model Studio is moving off the shared dashscope-intl domain to
  # workspace-specific ones — https://{WorkspaceId}.ap-southeast-1.maas
  # .aliyuncs.com/compatible-mode/v1 for Singapore, dashscope-us.aliyuncs.com
  # for US (Virginia) — which it says are faster and more stable. The shared
  # domain below still works; switch to the workspace domain from the Model
  # Studio console if this endpoint starts underperforming.
  - openai-compatible:
      model: qwen3-coder-next
      base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      label: qwen3-coder-next@dashscope
      api_key_env: DASHSCOPE_API_KEY
      max_tokens: 8192

  # Closed cheap tier, and the only entry needing no new integration. Also the
  # ladder against the existing Opus and Sonnet runs on the full question set.
  - claude:
      model: claude-haiku-4-5-20251001
      max_tokens: 8192

  # Open-weights flagship (753B MoE, ~40B active, MIT). Expected upper anchor:
  # it may well match the frontier models rather than fail, which is itself
  # worth knowing about the question set.
  #
  # reasoning_effort is load-bearing. GLM-5.2 always reasons and ships only
  # "high" and "max"; left unset it emits tens of thousands of tokens per call,
  # and because the runner is serial that is the difference between this pilot
  # taking an hour and taking a day. Z.ai recommends "max" for coding — "high"
  # is a deliberate trade of some quality for wall-clock, on the grounds that
  # the pilot ranks candidates rather than establishing anyone's best score.
  # Revisit for a real run.
  #
  # Thinking is deliberately NOT disabled. Z.ai documents
  # `thinking: {type: disabled}`, but it is reported to be ignored by the API,
  # and the model ships no non-thinking mode — so switching it off would score
  # a configuration nobody deploys, and would hurt TypeQL most, which is the
  # language the benchmark most needs a real answer on.
  #
  # Worth checking on the first run: z.ai's own OpenAI-compat docs do not list
  # reasoning_effort, so it may be ignored. Compare this model's output tokens
  # and latency against a run without it — if neither moves, the key is not
  # being honoured and the spelling needs revisiting.
  - openai-compatible:
      model: glm-5.2
      base_url: https://api.z.ai/api/paas/v4
      label: glm-5.2@z.ai
      api_key_env: ZAI_API_KEY
      max_tokens: 32768
      extra_body:
        reasoning_effort: high

  # Mid-tier open weights (284B total / 13B active, MIT, 1M context). The
  # 0731 build is the agent-tuned GA release.
  - openai-compatible:
      model: deepseek-v4-flash
      base_url: https://api.deepseek.com/v1
      label: deepseek-v4-flash@deepseek
      api_key_env: DEEPSEEK_API_KEY
      max_tokens: 16384

  # The only DENSE model in the slate: 30B parameters, all of them active,
  # against 3B active for Qwen and 13B for DeepSeek. That contrast is the
  # reason it is here — it separates per-token compute from language coverage
  # as an explanation for where models fail.
  #
  # Local-only; Meta ships no hosted API, so this runs through Ollama's MLX
  # build on Apple Silicon. Two consequences, both of which make its numbers
  # weaker evidence than the hosted entries':
  #
  #   1. REQUIRES `OLLAMA_CONTEXT_LENGTH=65536` in the server's environment.
  #      Ollama defaults to ~4k and silently truncates beyond it — the prompt
  #      here is ~37k, and this exact failure once made a local model answer
  #      UNANSWERABLE to every question while looking like a capability
  #      result. Run the context canary against this endpoint before trusting
  #      a single score.
  #   2. The `-mlx` tag is quantized (21GB for a 30B model), so it is not the
  #      same artifact as the FP8-ish hosted models. Treat its timings and
  #      accuracy as indicative, not directly comparable.
  - openai-compatible:
      model: muse-glimmer:30b-mlx
      base_url: http://localhost:11434/v1
      label: muse-glimmer-30b@ollama-mlx
      max_tokens: 16384

  # Agentic generalist rather than a code specialist (1T total / 32B active).
  # Thinking mode is enforced, hence the larger budget.
  - openai-compatible:
      model: kimi-k2.7-code
      base_url: https://api.moonshot.ai/v1
      label: kimi-k2.7-code@moonshot
      api_key_env: MOONSHOT_API_KEY
      max_tokens: 32768

questionsPath: data/reactome/questions-pilot.json
# No few-shot examples ship with this dataset, so the only valid count is 0.
exampleCounts:
  - 0
# Single attempt. Only the highest level actually runs, and retry behaviour is
# not what the pilot is choosing on — allowing retries would multiply the calls
# on exactly the models that fail most, which is backwards for a cost-capped
# ranking run. Raise this for the real run.
maxRetryCounts:
  - 0

[workspace]
resolver = "3"
members = [
    "src/core",
    "src/config",
    "src/dbs/typedb",
    "src/dbs/neo4j",
    "src/dbs/sql",
    "src/dbs/dummy",
    "src/providers/claude",
    "src/providers/llama",
    "src/providers/chatgpt",
    "src/providers/dummy",
    "src/runner",
    "src/output",
    "src/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bench-core = { path = "src/core" }
bench-config = { path = "src/config" }
bench-runner = { path = "src/runner" }
bench-output = { path = "src/output" }
db-typedb = { path = "src/dbs/typedb" }
db-neo4j = { path = "src/dbs/neo4j" }
db-sql = { path = "src/dbs/sql" }
db-dummy = { path = "src/dbs/dummy" }
provider-claude = { path = "src/providers/claude" }
provider-llama = { path = "src/providers/llama" }
provider-chatgpt = { path = "src/providers/chatgpt" }
provider-dummy = { path = "src/providers/dummy" }

anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

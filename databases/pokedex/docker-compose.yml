# Pilot stack: the three benchmark DBs seeded with the pokedex dataset from
# ../../data/pokedex. Same ports/credentials/db-name as the main (cars) stack,
# so src/pokedex.yml reuses the same connection URLs — run only ONE stack at a
# time. The typedb seed image (../typedb) bakes load.tqls, which sources
# /seed/schema.tql and /seed/data.tql, so pointing /seed at the pokedex folder
# reseeds `bench` with pokedex data.
services:
  typedb:
    image: typedb/typedb:3.11.5
    ports:
      - "1729:1729"
    command:
      - "--development-mode.enabled=true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1729'"]
      interval: 2s
      timeout: 2s
      retries: 30

  typedb-seed:
    build: ../typedb
    depends_on:
      typedb:
        condition: service_healthy
    volumes:
      - ../../data/pokedex/typedb:/seed:ro
    command:
      [
        "--address=typedb:1729",
        "--username=admin",
        "--password=password",
        "--tls-disabled",
      ]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ../../data/pokedex/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../data/pokedex/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ../postgres/roles.sql:/docker-entrypoint-initdb.d/03-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bench"]
      interval: 2s
      timeout: 2s
      retries: 30

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_db_transaction_timeout: 30s
    ports:
      - "7687:7687"
      - "7474:7474"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  # data.cypher wipes the graph first (MATCH (n) DETACH DELETE n), so re-runs
  # reseed cleanly.
  neo4j-seed:
    image: neo4j:5-community
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ../../data/pokedex/neo4j/data.cypher:/seed/data.cypher:ro
    entrypoint:
      [
        "cypher-shell",
        "-a",
        "neo4j://neo4j:7687",
        "-u",
        "neo4j",
        "-p",
        "password",
        "-f",
        "/seed/data.cypher",
      ]

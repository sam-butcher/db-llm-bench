dbs:
  - typedb:
      prompts: data/typedb
      url: http://localhost:1729
      database: bench
      auth:
        username: admin
        password: password
        tls: false
      schema: data/typedb/schema.tql
  - sql:
     prompts: data/sql
     url: postgres://bench_ro:bench_ro@localhost/bench
     schema: data/sql/schema.sql
  - neo4j:
     prompts: data/neo4j
     url: bolt://localhost:7687
     auth:
       username: neo4j
       password: password
     schema: data/neo4j/schema.txt
models:
  # Uncomment to benchmark Claude (reads ANTHROPIC_API_KEY from the environment):
#  - claude:
#     model: claude-haiku-4-5-20251001
questionsPath: data/questions.json
exampleCounts:
  - 0
  - 1
  - 3
maxRetryCounts:
  - 0
  - 2
  - 4

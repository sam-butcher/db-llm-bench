# Boots the three benchmark DBs and loads the Democracy Club candidates dataset
# from ../../data/candidates. Credentials/endpoints match src/config.yml.
#
# Postgres and Neo4j self-seed in-container (one-shot loaders). TypeDB is the
# odd one out: its bulk load is the multi-pass loader under test, a host tool,
# so after `docker compose up` run it against this typedb service:
#
#   data/candidates/typedb/passes/load.sh
#
# A separate project name keeps this isolated from the sample DBs compose.
name: candidates

volumes:
  cleaned: # data.cleaned.csv for Postgres server-side COPY
  # Neo4j gets its own copy: on startup it chowns its import dir to 700 neo4j,
  # which would lock Postgres (a different uid) out of a shared volume.
  neo4j_import: # data.cleaned.csv in Neo4j's import dir for LOAD CSV

services:
  # Clean the raw CSV once (host clean.py, stdlib only), then fan it out to both
  # server-side loader volumes. Postgres COPY and Neo4j LOAD CSV both read on the
  # server, so the file must live on a volume each server can see.
  prep:
    image: python:3.12-slim
    volumes:
      - ../../data/candidates:/candidates:ro
      - cleaned:/out
      - neo4j_import:/out-neo4j
    command:
      - sh
      - -c
      - >
        python3 /candidates/clean.py /candidates/data.csv /out/data.cleaned.csv &&
        cp /out/data.cleaned.csv /out-neo4j/data.cleaned.csv &&
        chmod 0644 /out/data.cleaned.csv /out-neo4j/data.cleaned.csv

  typedb:
    # Must match the host loader version (typedb loader is a host tool); a
    # mismatch panics the server on the protocol handshake.
    image: typedb/typedb:3.12.1
    ports:
      - "1729:1729"
    command:
      - "--development-mode.enabled=true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1729'"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: candidates
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cleaned:/data:ro # server-side COPY reads /data/data.cleaned.csv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d candidates"]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot: schema -> load (server-side COPY of the cleaned CSV) -> read-only
  # role. Idempotent-ish: load.sql recreates staging and uses ON CONFLICT.
  postgres-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      prep:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: postgres
    volumes:
      - ../../data/candidates/sql:/sql:ro
      - ../postgres/roles.sql:/roles.sql:ro
    entrypoint:
      - sh
      - -c
      - >
        psql -h postgres -U postgres -d candidates -v ON_ERROR_STOP=1
        -v data_path=/data/data.cleaned.csv
        -f /sql/schema.sql -f /sql/load.sql -f /roles.sql

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7687:7687"
      - "7474:7474" # browser UI, handy for debugging
    volumes:
      # LOAD CSV reads file:///data.cleaned.csv from the import dir; a named
      # volume is writable, so Neo4j's startup chown of the dir succeeds.
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: constraints + LOAD CSV MERGE (idempotent across re-runs).
  neo4j-seed:
    image: neo4j:5-community
    depends_on:
      neo4j:
        condition: service_healthy
      prep:
        condition: service_completed_successfully
    volumes:
      - ../../data/candidates/neo4j:/seed:ro
    entrypoint:
      - cypher-shell
      - -a
      - neo4j://neo4j:7687
      - -u
      - neo4j
      - -p
      - password
      - --param
      - "csv => 'file:///data.cleaned.csv'"
      - -f
      - /seed/load.cypher

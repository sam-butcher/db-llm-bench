[workspace]
resolver = "3"
members = [
    "src/core",
    "src/config",
    "src/dbs/dummy",
    "src/dbs/typedb",
    "src/providers/dummy",
    "src/runner",
    "src/output",
    "src/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bench-core = { path = "src/core" }
bench-config = { path = "src/config" }
bench-runner = { path = "src/runner" }
bench-output = { path = "src/output" }
db-dummy = { path = "src/dbs/dummy" }
db-typedb = { path = "src/dbs/typedb" }
provider-dummy = { path = "src/providers/dummy" }

anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml2 = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

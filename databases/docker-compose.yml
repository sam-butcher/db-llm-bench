# The three benchmark DBs, each seeded with the car dataset from ../data/sample.
# Credentials match the defaults the DB packages expect (see src/config.yml).
services:
  typedb:
    image: typedb/typedb:3.11.5
    ports:
      - "1729:1729"
    command:
      - "--development-mode.enabled=true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1729'"]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot loader; installs the console (the server image ships none) and
  # drops + recreates `bench`, so re-runs reseed cleanly.
  typedb-seed:
    build: ./typedb
    depends_on:
      typedb:
        condition: service_healthy
    volumes:
      - ../data/sample/typedb:/seed:ro
    command:
      [
        "--address=typedb:1729",
        "--username=admin",
        "--password=password",
        "--tls-disabled",
      ]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # initdb runs these on first boot of an empty data volume.
      - ../data/sample/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../data/sample/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./postgres/roles.sql:/docker-entrypoint-initdb.d/03-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bench"]
      interval: 2s
      timeout: 2s
      retries: 30

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/password
      # Server-side transaction timeout; the DB package's client ceiling is
      # slightly longer so this fires first with a clean TransactionTimedOut.
      NEO4J_db_transaction_timeout: 30s
    ports:
      - "7687:7687"
      - "7474:7474" # browser UI, handy for debugging
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot loader; MERGE makes it idempotent across re-runs.
  neo4j-seed:
    image: neo4j:5-community
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ../data/sample/neo4j/data.cypher:/seed/data.cypher:ro
    entrypoint:
      [
        "cypher-shell",
        "-a",
        "neo4j://neo4j:7687",
        "-u",
        "neo4j",
        "-p",
        "password",
        "-f",
        "/seed/data.cypher",
      ]

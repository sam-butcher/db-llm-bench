# Candidates dataset benchmarked against the local Ollama qwen model.
#
# Prereqs:
#   1. Seed the candidates stack (drops + reloads all three DBs):
#        cd databases/candidates && docker compose up -d --build
#   2. Ollama up with the model pulled:
#        ollama serve &   ollama pull qwen3.6:35b-mlx
#
# Run:  cargo run -p bench-cli -- src/candidates.yml results-candidates.json
#
# The candidates dataset ships no few-shot examples, so exampleCounts is [0].
dbs:
  - typedb:
      prompts: data/prompts/typedb.txt
      url: http://localhost:1729
      database: candidates
      auth:
        username: admin
        password: password
        tls: false
      schema: data/candidates/typedb/schema.tql
      examples: data/candidates/typedb
      skills: data/skills/typedb
  - sql:
      prompts: data/prompts/sql.txt
      url: postgres://bench_ro:bench_ro@localhost/candidates
      schema: data/candidates/sql/schema.sql
      examples: data/candidates/sql
      skills: data/skills/sql
  - neo4j:
      prompts: data/prompts/neo4j.txt
      url: bolt://localhost:7687
      auth:
        username: neo4j
        password: password
      schema: data/candidates/neo4j/schema.txt
      examples: data/candidates/neo4j
      skills: data/skills/neo4j
models:
  - claude:
      model: claude-opus-5
#  - openai-compatible:
#      model: qwen3.6:27b-mlx
#      base_url: http://localhost:11434/v1
#      label: qwen3.6-27b-mlx
questionsPath: data/candidates/questions.json
exampleCounts:
  - 3
maxRetryCounts:
  - 4
skillsBaseline: false
